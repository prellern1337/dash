name: Update prime yields

on:
  workflow_dispatch:
  schedule:
    # Runs approximately every 10 days (8-11 days across month boundaries) at 14:00 UTC.
    # Approx. 16:00 Norway summer time / 15:00 winter time.
    - cron: '0 14 1,11,21 * *'

jobs:
  update-yields:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Vercel prime yield update
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          curl -fsS \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "https://dash-eight-topaz.vercel.app/api/yields?action=update"
