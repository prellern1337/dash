name: Update SEB swaps

on:
  workflow_dispatch:
  schedule:
    # Runs Monday-Friday at 07:30, 10:30, 13:00 and 15:00 UTC.
    # Approx. 09:30, 12:30, 15:00 and 17:00 Norway summer time.
    - cron: '30 7,10 * * 1-5'
    - cron: '0 13,15 * * 1-5'

jobs:
  update-swaps:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Legacy trigger (until scheduler activation) Vercel SEB swap update
        if: vars.DATA_SCHEDULER_ENABLED != 'true'
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          response="$(curl -fsS \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "https://dash-martin-mogstad-s-projects.vercel.app/api/swaps?action=update")"

          echo "$response"

          node -e '
            const payload = JSON.parse(process.argv[1]);
            if (payload.status === "error" || payload.status === "partial") {
              console.error(payload.message || `SEB swap update returned ${payload.status}`);
              process.exit(1);
            }
          ' "$response"

      - name: Idempotent secondary/manual catch-up
        if: vars.DATA_SCHEDULER_ENABLED == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 75 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "https://dash-eight-topaz.vercel.app/api/data-update?dataset=swaps"
