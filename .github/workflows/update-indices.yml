name: Update market indices

on:
  workflow_dispatch:
  schedule:
    # Runs Monday-Friday after US market close.
    # Approx. 00:30 Norway summer time / 23:30 winter time.
    - cron: '30 22 * * 1-5'

jobs:
  update-indices:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Vercel market indices update
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          curl -fsS \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "https://dash-martin-mogstad-s-projects.vercel.app/api/indices?action=update"
