name: Update SEB swaps

on:
  workflow_dispatch:
  schedule:
    # Runs Monday-Friday at 07:30, 10:30, 13:00 and 15:00 UTC.
    # Approx. 09:30, 12:30, 15:00 and 17:00 Norway summer time.
    - cron: '30 7,10 * * 1-5'
    - cron: '0 13,15 * * 1-5'

jobs:
  update-swaps:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Vercel SEB swap update
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          curl -fsS \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "https://dash-martin-mogstad-s-projects.vercel.app/api/update-swaps"
